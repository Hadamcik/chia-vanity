<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanity WebGPU benchmark</title>
    <style>
        body { background: #101114; color: #f4f4f5; font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; }
        button { font: inherit; padding: .6rem 1rem; }
        pre { background: #191b20; border-radius: 8px; overflow: auto; padding: 1rem; }
        .muted { color: #a1a1aa; }
    </style>
</head>
<body>
    <h1>Vanity WebGPU fixed-base benchmark</h1>
    <p class="muted">BLS12-381 G1, including affine normalization and GPU readback.</p>
    <button id="run">Run benchmark</button>
    <pre id="output">Ready.</pre>
    <script type="module">
        import init, { runFixedBaseBenchmark } from './pkg/webgpu_vanity_wasm.js';

        const output = document.querySelector('#output');
        const button = document.querySelector('#run');

        async function run() {
            button.disabled = true;
            output.textContent = 'Initializing WebGPU…';
            try {
                await init();
                const results = [];
                for (const count of [256, 1024, 4096, 16384]) {
                    output.textContent = `Running ${count.toLocaleString()} points…`;
                    results.push(await runFixedBaseBenchmark(count, 3));
                    output.textContent = JSON.stringify(results, null, 2);
                }
                document.title = 'DONE - Vanity WebGPU benchmark';
            } catch (error) {
                output.textContent = error?.stack || String(error);
                document.title = 'FAILED - Vanity WebGPU benchmark';
            } finally {
                button.disabled = false;
            }
        }

        button.addEventListener('click', run);
        window.runVanityWebGpuBenchmark = run;
    </script>
</body>
</html>
